controller_manager:
  ros__parameters:
    update_rate: 100
    # Gilt für Gazebo. hardware.launch.py überschreibt den Wert für den echten Roboter mit false.
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters: {}

# Gelenknamen sind in allen Varianten gleich und in aluminium_profile_frame.urdf.xacro
# sowie ros2_control.xacro festgelegt (x_joint, y_joint, z_joint).
joint_trajectory_controller:
  ros__parameters:
    joints:
      - x_joint
      - y_joint
      - z_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: true
    open_loop_control: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
